<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>X-GIF Forge</title>
<style>
:root { --bg:#0f1419; --card:#1e2732; --accent:#1d9bf0; --text:#e7e9ea; --muted:#71767b; }
* { box-sizing:border-box; }
body { margin:0; font-family:system-ui,sans-serif; background:var(--bg); color:var(--text); }
.container { max-width:1100px; margin:0 auto; padding:16px; }
h1 { margin:0 0 4px; }
.card { background:var(--card); border-radius:12px; padding:16px; margin-bottom:16px; }
label { display:block; margin:10px 0 4px; font-size:0.85rem; color:var(--muted); }
input, select, button { width:100%; padding:10px; border-radius:8px; border:1px solid #38444d; background:#0f1419; color:var(--text); }
button { background:var(--accent); border:none; font-weight:600; margin-top:10px; min-height:44px; }
button.secondary { background:#38444d; }
.preview { width:100%; max-height:240px; background:#000; border-radius:8px; display:flex; align-items:center; justify-content:center; margin:10px 0; overflow:hidden; }
.preview img { max-width:100%; max-height:240px; }
.status { color:var(--muted); font-size:0.85rem; margin-top:8px; white-space:pre-wrap; }
.actions { display:flex; flex-direction:column; gap:6px; margin-top:8px; }
</style>
</head>
<body>
<div class="container">
  <h1>X-GIF Forge</h1>
  <div class="card">
    <label>Image(s)</label>
    <input type="file" id="file" accept="image/*" multiple>
    <div class="preview" id="preview">No file</div>
    <label>Width (px)</label>
    <input type="number" id="width" value="400">
    <label>FPS</label>
    <input type="number" id="fps" value="8">
    <button id="generate">Make GIF</button>
    <div class="status" id="status"></div>
    <div class="actions" id="actions" style="display:none">
      <button id="download">Download</button>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/gif.js@0.2.0/dist/gif.js"></script>
<script>
const $ = id => document.getElementById(id);
let currentUrl = null;

function setStatus(t) { $('status').textContent = t; console.log(t); }

$('file').onchange = () => {
  const f = $('file').files[0];
  if (!f) return;
  const url = URL.createObjectURL(f);
  $('preview').innerHTML = `<img src="${url}" style="max-width:100%">`;
};

$('generate').onclick = async () => {
  const files = [...$('file').files];
  if (!files.length) return alert('Choose an image');
  setStatus('Starting…');
  $('actions').style.display = 'none';

  try {
    const targetW = Math.max(100, Math.round(+$('width').value || 400));
    const fps = Math.max(1, +$('fps').value || 8);
    const delay = Math.round(1000 / fps);

    const gif = new GIF({
      workers: 2,
      quality: 10,
      workerScript: 'https://cdn.jsdelivr.net/npm/gif.js@0.2.0/dist/gif.worker.js'
    });

    for (let i = 0; i < files.length; i++) {
      const file = files[i];
      setStatus(`Processing image ${i + 1}/${files.length}`);
      const img = new Image();
      img.src = URL.createObjectURL(file);
      await new Promise((res, rej) => { img.onload = res; img.onerror = rej; });

      const h = Math.max(1, Math.round(img.height * (targetW / img.width)));
      setStatus(`Canvas size: ${targetW} × ${h}`);

      const canvas = document.createElement('canvas');
      canvas.width = targetW;
      canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, targetW, h);

      // Extra safety check
      if (!Number.isInteger(canvas.width) || !Number.isInteger(canvas.height)) {
        throw new Error(`Bad canvas size: ${canvas.width}×${canvas.height}`);
      }

      try {
        gif.addFrame(canvas, { copy: true, delay });
      } catch (e) {
        setStatus(`addFrame failed on image ${i + 1}: ${e.message}`);
        throw e;
      }
      URL.revokeObjectURL(img.src);
    }

    setStatus('Encoding GIF…');
    gif.on('finished', blob => {
      if (currentUrl) URL.revokeObjectURL(currentUrl);
      currentUrl = URL.createObjectURL(blob);
      $('preview').innerHTML = `<img src="${currentUrl}">`;
      setStatus(`Done — ${(blob.size / 1024 / 1024).toFixed(2)} MB`);
      $('actions').style.display = 'flex';
    });
    gif.on('error', err => setStatus('gif.js error: ' + err.message));
    gif.render();
  } catch (e) {
    setStatus('Error: ' + e.message);
    console.error(e);
  }
};

$('download').onclick = () => {
  const a = document.createElement('a');
  a.href = currentUrl;
  a.download = 'x-gif-forge.gif';
  a.click();
};
</script>
</body>
</html>
