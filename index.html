<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>X-GIF Forge</title>
<style>
:root { --bg:#0f1419; --card:#1e2732; --accent:#1d9bf0; --text:#e7e9ea; --muted:#71767b; }
* { box-sizing:border-box; }
body { margin:0; font-family:system-ui,sans-serif; background:var(--bg); color:var(--text); }
.container { max-width:1100px; margin:0 auto; padding:16px; }
h1 { margin:0 0 4px; }
.grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
@media(max-width:800px){ .grid { grid-template-columns:1fr; } }
.card { background:var(--card); border-radius:12px; padding:16px; }
label { display:block; margin:10px 0 4px; font-size:0.85rem; color:var(--muted); }
input, select, button { width:100%; padding:10px; border-radius:8px; border:1px solid #38444d; background:#0f1419; color:var(--text); }
button { background:var(--accent); border:none; font-weight:600; margin-top:10px; min-height:44px; }
button.secondary { background:#38444d; }
.preview { width:100%; max-height:240px; background:#000; border-radius:8px; display:flex; align-items:center; justify-content:center; margin:10px 0; overflow:hidden; }
.preview img, .preview video { max-width:100%; max-height:240px; }
.status { color:var(--muted); font-size:0.85rem; margin-top:8px; white-space:pre-wrap; }
.actions { display:flex; flex-direction:column; gap:6px; margin-top:8px; }
</style>
</head>
<body>
<div class="container">
  <h1>X-GIF Forge</h1>
  <p style="color:#71767b">Simple GIF creator for X</p>
  <div class="grid">
    <div class="card">
      <label>Image or Video</label>
      <input type="file" id="file" accept="image/*,video/*" multiple>
      <div class="preview" id="preview">No file</div>
      <label>Width (px)</label>
      <input type="number" id="width" value="400">
      <label>FPS</label>
      <input type="number" id="fps" value="8">
      <button id="generate">Make GIF</button>
      <div class="status" id="status"></div>
      <div class="actions" id="actions" style="display:none">
        <button id="download">Download</button>
        <button id="share" class="secondary">Share / Save</button>
      </div>
    </div>
    <div class="card">
      <p style="color:#71767b;font-size:0.9rem">Tip: Start with a single image. Videos are slower and can fail on some phones.</p>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/gif.js@0.2.0/dist/gif.js"></script>
<script>
const $ = id => document.getElementById(id);
let currentUrl = null;

fileInput.onchange = () => {
  const files = Array.from(fileInput.files);
  if (!files.length) {
    preview.innerHTML = '<span style="color:#555">Preview</span>';
    return;
  }
  const first = files[0];
  const url = URL.createObjectURL(first);
  preview.innerHTML = '';
  if (first.type.startsWith('video')) {
    const vid = document.createElement('video');
    vid.src = url;
    vid.controls = true;
    vid.muted = true;
    vid.style.maxWidth = '100%';
    vid.style.maxHeight = '280px';
    preview.appendChild(vid);
  } else {
    const img = document.createElement('img');
    img.src = url;
    img.style.maxWidth = '100%';
    img.style.maxHeight = '280px';
    preview.appendChild(img);
    if (files.length > 1) {
      const badge = document.createElement('div');
      badge.className = 'count';
      badge.textContent = files.length + ' images';
      preview.appendChild(badge);

function setStatus(t) { $('status').textContent = t; }

$('generate').onclick = async () => {
  const files = [...$('file').files];
  if (!files.length) return alert('Choose a file');
  setStatus('Working…');
  $('actions').style.display = 'none';

  try {
    const w = Math.max(100, Math.round(+$('width').value || 400));
    const fps = Math.max(1, +$('fps').value || 8);
    const delay = Math.round(1000 / fps);

    const gif = new GIF({
      workers: 2,
      quality: 10,
      workerScript: 'https://cdn.jsdelivr.net/npm/gif.js@0.2.0/dist/gif.worker.js'
    });

    if (files[0].type.startsWith('video')) {
      setStatus('Videos can be unreliable — trying…');
      const video = document.createElement('video');
      video.muted = true;
      video.playsInline = true;
      video.src = URL.createObjectURL(files[0]);
      await new Promise(r => video.onloadeddata = r);
      const h = Math.max(1, Math.round(video.videoHeight * (w / video.videoWidth)));
      const canvas = document.createElement('canvas');
      canvas.width = w;
      canvas.height = h;
      const ctx = canvas.getContext('2d');
      const frames = 20;
      for (let i = 0; i < frames; i++) {
        video.currentTime = (i / frames) * Math.min(video.duration, 5);
        await new Promise(r => video.onseeked = r);
        ctx.drawImage(video, 0, 0, w, h);
        gif.addFrame(ctx, { copy: true, delay });
      }
    } else {
      setStatus('Processing images…');
      for (const file of files) {
        const img = new Image();
        img.src = URL.createObjectURL(file);
        await new Promise(r => img.onload = r);
        const h = Math.max(1, Math.round(img.height * (w / img.width)));
        const canvas = document.createElement('canvas');
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        gif.addFrame(ctx, { copy: true, delay });
        URL.revokeObjectURL(img.src);
      }
    }

    setStatus('Encoding…');
    gif.on('finished', blob => {
      if (currentUrl) URL.revokeObjectURL(currentUrl);
      currentUrl = URL.createObjectURL(blob);
      $('preview').innerHTML = `<img src="${currentUrl}">`;
      setStatus(`Done — ${(blob.size/1024/1024).toFixed(2)} MB`);
      $('actions').style.display = 'flex';
    });
    gif.render();
  } catch (e) {
    setStatus('Failed: ' + e.message);
    console.error(e);
  }
};

$('download').onclick = () => {
  const a = document.createElement('a');
  a.href = currentUrl;
  a.download = 'gif.gif';
  a.click();
};

$('share').onclick = async () => {
  if (!currentUrl) return;
  const blob = await (await fetch(currentUrl)).blob();
  const file = new File([blob], 'gif.gif', { type: 'image/gif' });
  if (navigator.canShare?.({ files: [file] })) {
    try { await navigator.share({ files: [file] }); } catch {}
  } else {
    $('download').click();
  }
};
</script>
</body>
</html>
